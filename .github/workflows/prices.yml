# Copies the latest EU Cloud Price Index into data/prices.json monthly and opens a pull request.
name: Refresh prices
on:
  schedule:
    - cron: '0 6 4 * *' # the index refreshes on the 3rd
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run update-prices # reads https://raw.githubusercontent.com/moveinfra/eu-cloud-prices/main/data/eu-cloud-prices.json
      - run: npm test
      - run: npm run build
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: prices/refresh
          commit-message: "prices: monthly refresh from the EU Cloud Price Index"
          title: "Monthly price refresh"
          body: |
            `data/prices.json` regenerated by `scripts/update-prices.mjs` from the
            [EU Cloud Price Index](https://github.com/moveinfra/eu-cloud-prices).
            Before merging: run the CLI on the samples and compare the totals with last month; check any change over 10%.
